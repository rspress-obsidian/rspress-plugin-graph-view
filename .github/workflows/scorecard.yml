name: Scorecard Supply Chain Security

on:
  # Run on schedule — Scorecard requires this for public result publishing
  schedule:
    - cron: "30 1 * * 6" # Every Saturday at 01:30 UTC
  # Run on pushes to the default branch
  push:
    branches: [main]
  # Allow manual runs
  workflow_dispatch:

# Restrict default token permissions to read-only
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Required to upload SARIF results to GitHub code scanning
      security-events: write
      # Required to publish results and required by ossf/scorecard-action
      id-token: write
      # Required for checking out the repository
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to the OpenSSF public dashboard (requires GITHUB_TOKEN)
          publish_results: true

      - name: Upload Scorecard results as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload Scorecard results to GitHub code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
